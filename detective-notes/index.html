<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7d8a4f">
<title>Detective Notes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800&family=Questrial&display=swap">
<style>
/* Layout: one printed pad sheet centred on a gingham tablecloth; three ruled grids, six player columns. */
:root {
  --cloth-a: #7d8a4f;
  --cloth-b: #e9e6d6;
  --paper: #fbfaf6;
  --ink: #2f3742;
  --rule: #3a424d;
  --muted: #6b7280;
  --cross: #b4473c;
  --tick: #2f7d55;
  --maybe: #b8862a;
  --hit: #eef0e4;
  --font-display: "League Spartan", "Arial Black", system-ui, sans-serif;
  --font-body: "Questrial", "Century Gothic", "Avenir", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --cloth-a: #3b4228; --cloth-b: #23261c; --paper: #1f2226; --ink: #e4e6ea; --rule: #8b939e;
  --muted: #9aa1ab; --cross: #e8796d; --tick: #6ccf9a; --maybe: #e2b65a; --hit: #2a2e33; color-scheme: dark } }
:root[data-theme="dark"] {
  --cloth-a: #3b4228; --cloth-b: #23261c; --paper: #1f2226; --ink: #e4e6ea; --rule: #8b939e;
  --muted: #9aa1ab; --cross: #e8796d; --tick: #6ccf9a; --maybe: #e2b65a; --hit: #2a2e33; color-scheme: dark }

*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; }
body {
  background-color: var(--cloth-b);
  background-image:
    linear-gradient(90deg, color-mix(in srgb, var(--cloth-a) 55%, transparent) 50%, transparent 50%),
    linear-gradient(color-mix(in srgb, var(--cloth-a) 55%, transparent) 50%, transparent 50%);
  background-size: 56px 56px;
  color: var(--ink);
  font-family: var(--font-body);
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet {
  max-width: 460px; margin: 0 auto;
  background: var(--paper);
  padding: 22px 18px 14px;
  box-shadow: 0 1px 2px rgb(0 0 0 / .18), 0 12px 30px rgb(0 0 0 / .22);
  border-top: 3px dotted color-mix(in srgb, var(--ink) 18%, transparent);
}
h1 {
  font-family: var(--font-display); font-weight: 800;
  font-size: clamp(2.6rem, 12vw, 3.6rem); line-height: .9; letter-spacing: -.02em;
  margin: 0 0 4px; text-align: center; text-wrap: balance;
}
.players-label {
  font-family: var(--font-display); font-weight: 700; letter-spacing: .14em;
  font-size: .8rem; text-align: right; margin: 6px 4px 2px 0;
}
table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-bottom: 18px; }
col.name { width: 40%; }
th.section {
  font-family: var(--font-display); font-weight: 700; letter-spacing: .1em;
  font-size: 1rem; text-align: left; padding: 6px 0 4px 2.2rem; border-bottom: 1.5px solid var(--rule);
}
td, th.p { border: 1.5px solid var(--rule); }
td.name {
  border-left: 0; padding: 0;
  font-size: 1rem; letter-spacing: .02em;
}
td.name button {
  all: unset; box-sizing: border-box; display: block; width: 100%; padding: 9px 4px 7px 6px; cursor: pointer;
}
tr.out td.name button { text-decoration: line-through 2px var(--cross); color: var(--muted); }
tr.solved td.name { background: var(--hit); }
tr.solved td.name button { font-weight: 700; }
tr.solved td.name button::after { content: " ★"; color: var(--maybe); }
th.p { padding: 0; height: 2.2rem; }
th.p input {
  all: unset; box-sizing: border-box; width: 100%; height: 100%; text-align: center;
  font-family: var(--font-display); font-weight: 700; font-size: .85rem; text-transform: uppercase;
}
th.p input::placeholder { color: color-mix(in srgb, var(--muted) 55%, transparent); }
td.c { padding: 0; }
td.c button {
  all: unset; box-sizing: border-box; display: grid; place-items: center; width: 100%; height: 2.3rem;
  cursor: pointer; font-size: 1.25rem; font-family: var(--font-display); font-weight: 800;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
td.c button[data-v="1"] { color: var(--cross); }
td.c button[data-v="2"] { color: var(--tick); }
td.c button[data-v="3"] { color: var(--maybe); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--maybe); outline-offset: -2px; }
@media (hover: hover) { td.c button:hover { background: var(--hit); } }

.foot {
  display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  font-size: .72rem; color: var(--muted); border-top: 1.5px solid var(--rule); padding-top: 6px;
  font-variant-numeric: tabular-nums;
}
.tools {
  max-width: 460px; margin: 14px auto 0; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  background: var(--paper); padding: 10px 14px; box-shadow: 0 6px 18px rgb(0 0 0 / .18);
  font-size: .85rem;
}
.legend { display: flex; gap: 12px; flex-wrap: wrap; flex: 1; min-width: 0; }
.legend b { font-family: var(--font-display); }
.k1 { color: var(--cross); } .k2 { color: var(--tick); } .k3 { color: var(--maybe); }
.btn {
  font: inherit; font-weight: 700; border: 1.5px solid var(--rule); background: transparent; color: var(--ink);
  padding: 6px 12px; border-radius: 3px; cursor: pointer;
}
a.btn { text-decoration: none; display: inline-block; }
.btn.danger { border-color: var(--cross); color: var(--cross); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.log {
  max-width: 460px; margin: 14px auto 0; background: var(--paper); padding: 16px 16px 12px;
  box-shadow: 0 6px 18px rgb(0 0 0 / .18);
}
.log h2 {
  font-family: var(--font-display); font-weight: 700; letter-spacing: .1em; font-size: 1rem;
  margin: 0 0 10px; border-bottom: 1.5px solid var(--rule); padding-bottom: 4px;
}
.log form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.log label { display: grid; gap: 3px; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); min-width: 0; }
.log label.wide { grid-column: 1 / -1; }
.log select, .log input[type="text"] {
  font: inherit; font-size: .95rem; letter-spacing: 0; text-transform: none; color: var(--ink);
  background: var(--paper); border: 1.5px solid var(--rule); border-radius: 3px; padding: 7px 6px; width: 100%; min-width: 0;
}
.log .actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.log .actions small { color: var(--muted); flex: 1; min-width: 10rem; }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.entries { list-style: none; margin: 12px 0 0; padding: 0; display: grid; }
.entries li {
  display: grid; grid-template-columns: 2.2rem 1fr auto; gap: 8px; align-items: baseline;
  padding: 7px 0; border-top: 1px dashed color-mix(in srgb, var(--rule) 45%, transparent);
}
.entries .n { font-family: var(--font-display); font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.entries .t { min-width: 0; overflow-wrap: anywhere; }
.entries .t b { font-family: var(--font-display); }
.entries .t em { font-style: normal; color: var(--muted); }
.entries .tag { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--maybe); margin-right: 4px; }
.entries .del { all: unset; cursor: pointer; color: var(--muted); padding: 0 4px; font-size: 1.1rem; }
.entries .empty { display: block; color: var(--muted); font-size: .85rem; border: 0; }
.hint { max-width: 460px; margin: 8px auto 0; font-size: .78rem; color: var(--ink); background: var(--paper); padding: 8px 14px; opacity: .92; }
</style>
</head>
<body>

<main class="sheet" id="sheet">
  <h1>Detective<br>Notes</h1>
  <div class="players-label">PLAYERS</div>
  <div id="grids"></div>
  <div class="foot"><span id="count">0 of 21 cleared</span><span>Case file № <span id="caseno"></span></span></div>
</main>

<div class="tools">
  <div class="legend"><span><b class="k1">✕</b> doesn't have</span><span><b class="k2">✓</b> has it</span><span><b class="k3">?</b> maybe</span></div>
  <a class="btn" id="rulesLink" href="rules.pdf" target="_blank" rel="noopener">Rules (PDF)</a>
  <div id="resetArea"><button class="btn" id="resetBtn" type="button">New game</button></div>
</div>
<section class="log" aria-labelledby="logTitle">
  <h2 id="logTitle">CASE LOG</h2>
  <form id="logForm">
    <label>Shown by<select id="lFrom"></select></label>
    <label>Shown to<select id="lTo"></select></label>
    <label>Card<select id="lCard"></select></label>
    <label>Because of<select id="lWhy">
      <option>Suggestion</option><option>Clue card</option><option>Other</option>
    </select></label>
    <label class="wide">Note<input type="text" id="lNote" maxlength="140" placeholder="e.g. Scarlett said what? Everyone showed left"></label>
    <div class="actions">
      <button class="btn primary" type="submit">Add note</button>
      <small id="lHelp">A card shown to you is also ticked ✓ on the sheet.</small>
    </div>
  </form>
  <ul class="entries" id="entries"></ul>
</section>
<p class="hint">Tap a box to cycle ✕ → ✓ → ? → blank. Tap a name to strike it off; tap again to star it as the answer. Type initials in the top row.</p>

<script>
const SECTIONS = [
  ["WHO?", ["Green","Mustard","Peacock","Plum","Scarlett","White"]],
  ["WHAT?", ["Candlestick","Dagger","Lead Pipe","Revolver","Rope","Wrench"]],
  ["WHERE?", ["Ballroom","Billiard Room","Conservatory","Dining Room","Hall","Kitchen","Library","Lounge","Study"]],
];
const COLS = 6, MARKS = ["", "✕", "✓", "?"], KEY = "detective-notes-v1";
const fresh = () => ({ players: Array(COLS).fill(""), cells: {}, rows: {}, log: [], caseNo: String(Math.floor(1000 + Math.random()*9000)) });
let state;
try { state = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch { state = fresh(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

function render() {
  const grids = document.getElementById("grids");
  grids.innerHTML = "";
  SECTIONS.forEach(([title, items], si) => {
    const t = document.createElement("table");
    let html = `<colgroup><col class="name">${"<col>".repeat(COLS)}</colgroup><tr><th class="section" scope="col">${title}</th>`;
    for (let c = 0; c < COLS; c++) {
      html += si === 0
        ? `<th class="p"><input id="p${c}" maxlength="3" placeholder="${c+1}" aria-label="Player ${c+1} initials" value="${(state.players[c]||"").replace(/"/g,"&quot;")}"></th>`
        : `<th class="p" aria-label="Player ${c+1}"><input tabindex="-1" readonly data-mirror="${c}" value="${(state.players[c]||"").replace(/"/g,"&quot;")}" aria-hidden="true"></th>`;
    }
    html += "</tr>";
    items.forEach(item => {
      const rs = state.rows[item] || 0;
      html += `<tr class="${rs===1?"out":rs===2?"solved":""}"><td class="name"><button type="button" data-row="${item}">${item}</button></td>`;
      for (let c = 0; c < COLS; c++) {
        const v = state.cells[item+"|"+c] || 0;
        html += `<td class="c"><button type="button" data-cell="${item}|${c}" data-v="${v}" aria-label="${item}, player ${c+1}">${MARKS[v]}</button></td>`;
      }
      html += "</tr>";
    });
    t.innerHTML = html;
    grids.appendChild(t);
  });
  document.getElementById("caseno").textContent = state.caseNo;
  updateCount();
}
function updateCount() {
  const n = Object.values(state.rows).filter(v => v === 1).length;
  document.getElementById("count").textContent = `${n} of 21 cleared`;
}

document.getElementById("grids").addEventListener("click", e => {
  const cell = e.target.closest("[data-cell]");
  if (cell) {
    const v = ((state.cells[cell.dataset.cell] || 0) + 1) % MARKS.length;
    if (v) state.cells[cell.dataset.cell] = v; else delete state.cells[cell.dataset.cell];
    cell.dataset.v = v; cell.textContent = MARKS[v]; save(); return;
  }
  const row = e.target.closest("[data-row]");
  if (row) {
    const name = row.dataset.row, v = ((state.rows[name] || 0) + 1) % 3;
    if (v) state.rows[name] = v; else delete state.rows[name];
    const tr = row.closest("tr"); tr.className = v===1?"out":v===2?"solved":"";
    updateCount(); save();
  }
});
document.getElementById("grids").addEventListener("input", e => {
  if (!e.target.id.startsWith("p")) return;
  const c = +e.target.id.slice(1);
  state.players[c] = e.target.value;
  document.querySelectorAll(`[data-mirror="${c}"]`).forEach(m => m.value = e.target.value);
  save();
});

const area = document.getElementById("resetArea");
function showReset() {
  area.innerHTML = `<button class="btn" id="resetBtn" type="button">New game</button>`;
  document.getElementById("resetBtn").onclick = () => {
    area.innerHTML = `<span class="confirm">Clear all marks? <button class="btn danger" id="yes" type="button">Clear</button><button class="btn" id="no" type="button">Cancel</button></span>`;
    document.getElementById("yes").onclick = () => {
      const keep = state.players; state = fresh(); /* log cleared too */ state.players = keep; save(); render(); showReset();
    };
    document.getElementById("no").onclick = showReset;
  };
}
const ALL_CARDS = SECTIONS.flatMap(([t, items]) => items.map(i => [t, i]));
const pname = c => c === "me" ? "Me" : (state.players[c] || `Player ${+c + 1}`);
const esc = t => String(t).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));

function fillSelects() {
  const keep = id => document.getElementById(id).value;
  const pOpts = sel => `<option value="me">Me</option>` +
    Array.from({length: COLS}, (_, c) => `<option value="${c}">${esc(pname(c))}</option>`).join("");
  const f = keep("lFrom"), t = keep("lTo");
  document.getElementById("lFrom").innerHTML = pOpts();
  document.getElementById("lTo").innerHTML = pOpts();
  document.getElementById("lFrom").value = f || "0";
  document.getElementById("lTo").value = t || "me";
  const cardSel = document.getElementById("lCard");
  if (!cardSel.options.length) {
    cardSel.innerHTML = `<option value="">Didn't see it</option>` +
      SECTIONS.map(([title, items]) => `<optgroup label="${title}">${items.map(i => `<option>${i}</option>`).join("")}</optgroup>`).join("");
  }
}

function renderLog() {
  if (!state.log) state.log = [];
  const ul = document.getElementById("entries");
  if (!state.log.length) {
    ul.innerHTML = `<li class="empty">No notes yet. Log each card someone shows, including the ones you show others.</li>`;
    return;
  }
  ul.innerHTML = state.log.map((e, i) => ({e, i})).reverse().map(({e, i}) => `
    <li><span class="n">${i + 1}</span>
      <span class="t"><span class="tag">${esc(e.why)}</span><b>${esc(pname(e.from))}</b> showed <b>${esc(pname(e.to))}</b>
        ${e.card ? `the <b>${esc(e.card)}</b>` : `<em>a card</em>`}${e.note ? `<br><em>${esc(e.note)}</em>` : ""}</span>
      <button class="del" type="button" data-del="${i}" aria-label="Delete note ${i + 1}">×</button></li>`).join("");
}

document.getElementById("logForm").addEventListener("submit", e => {
  e.preventDefault();
  const from = document.getElementById("lFrom").value, to = document.getElementById("lTo").value;
  const card = document.getElementById("lCard").value, why = document.getElementById("lWhy").value;
  const note = document.getElementById("lNote").value.trim();
  if (from === to) { document.getElementById("lHelp").textContent = "Shown by and Shown to must be different players."; return; }
  state.log.push({from, to, card, why, note});
  if (to === "me" && card && from !== "me") {
    state.cells[card + "|" + from] = 2;
    const btn = document.querySelector(`[data-cell="${CSS.escape(card + "|" + from)}"]`);
    if (btn) { btn.dataset.v = 2; btn.textContent = MARKS[2]; }
  }
  document.getElementById("lNote").value = "";
  document.getElementById("lCard").value = "";
  document.getElementById("lHelp").textContent = "Added. A card shown to you is also ticked ✓ on the sheet.";
  save(); renderLog();
});
document.getElementById("entries").addEventListener("click", e => {
  const d = e.target.closest("[data-del]");
  if (!d) return;
  state.log.splice(+d.dataset.del, 1); save(); renderLog();
});
document.getElementById("grids").addEventListener("change", e => {
  if (e.target.id && e.target.id.startsWith("p")) { fillSelects(); renderLog(); }
});

const _render = render;
render = function () { _render(); fillSelects(); renderLog(); };
render(); showReset();
</script>
</body>
</html>
